<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloading…</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; }
  a { color: inherit; }
</style>
</head>
<body>
<p id="msg">Downloading…</p>

<script>
  // ← Change these two lines when you swap in the real video
  const FILE = "video.mp4";
  const NAME = "video.mp4";

  function save(href) {
    const a = document.createElement("a");
    a.href = href;
    a.download = NAME;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function finish() {
    // Try to close the tab (browsers only allow this for script-opened tabs)
    setTimeout(() => {
      window.close();
      setTimeout(() => {
        document.getElementById("msg").innerHTML =
          'Done. <a href="#" id="again">Download again</a>';
        document.getElementById("again").onclick = (e) => { e.preventDefault(); start(); };
      }, 300);
    }, 800);
  }

  async function start() {
    try {
      // Fetch the file and save it as a blob: this forces a real download
      // instead of letting the browser open/play the video in the tab.
      const res = await fetch(FILE);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      const url = URL.createObjectURL(new Blob([blob], { type: "application/octet-stream" }));
      save(url);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (err) {
      // Fallback (e.g. opened straight from disk, where fetch is blocked)
      save(FILE);
    }
    finish();
  }

  start();
</script>
</body>
</html>
